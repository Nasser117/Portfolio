name: Manual Build to Docs Automation

on:
  push:
    branches:
      - main  # Trigger only when you push to main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web (Step 2)
        run: flutter build web --base-href "/Portfolio/"

      - name: Clean and Copy to Docs (Step 1 & 3)
        run: |
          rm -rf docs
          mkdir docs
          cp -r build/web/* docs/
          touch docs/.nojekyll

      - name: Commit and Push changes (Step 4 & 5)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Build: Update docs folder"
          branch: main
          file_pattern: 'docs/*'